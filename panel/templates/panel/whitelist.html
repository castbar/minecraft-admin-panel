{% extends 'panel/base.html' %}

{% block title %}Whitelist - Minecraft Server Manager{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4"><i class="bi bi-people"></i> Whitelist</h2>
    
    <div class="card mb-4">
        <div class="card-header">
            <h5>Agregar Usuario</h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <input type="text" class="form-control" id="whitelist-username" placeholder="Nombre de usuario">
                <button class="btn btn-primary mt-2" onclick="addToWhitelist()">Agregar</button>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h5>Usuarios en Whitelist</h5>
        </div>
        <div class="card-body">
            <div id="whitelist-list">Cargando...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function addToWhitelist() {
        const username = document.getElementById('whitelist-username').value.trim();
        if (!username) {
            alert('Por favor ingresa un nombre de usuario');
            return;
        }
        
        fetch(`/api/servers/${serverId}/whitelist/add/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ username: username })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Usuario agregado exitosamente');
                document.getElementById('whitelist-username').value = '';
                loadWhitelist();
            } else {
                alert('Error: ' + (data.error || 'Error desconocido'));
            }
        })
        .catch(error => {
            alert('Error de conexión: ' + error);
        });
    }
    
    function loadWhitelist() {
        if (!serverId) return;
        
        fetch(`/api/servers/${serverId}/whitelist/`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const list = document.getElementById('whitelist-list');
                    if (data.data && data.data.length > 0) {
                        list.innerHTML = '<ul class="list-group">' + 
                            data.data.map(user => {
                                const username = typeof user === 'string' ? user : (user.name || user.username || 'Unknown');
                                return `<li class="list-group-item d-flex justify-content-between align-items-center">
                                    ${username}
                                    <button class="btn btn-sm btn-danger" onclick="removeFromWhitelist('${username}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </li>`;
                            }).join('') + '</ul>';
                    } else {
                        list.innerHTML = '<p class="text-muted">No hay usuarios en la whitelist</p>';
                    }
                } else {
                    list.innerHTML = '<p class="text-danger">Error: ' + (data.error || 'Error desconocido') + '</p>';
                }
            })
            .catch(error => {
                document.getElementById('whitelist-list').innerHTML = '<p class="text-danger">Error al cargar whitelist: ' + error + '</p>';
            });
    }
    
    function removeFromWhitelist(username) {
        if (!confirm(`¿Eliminar ${username} de la whitelist?`)) return;
        
        fetch(`/api/servers/${serverId}/whitelist/remove/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ username: username })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadWhitelist();
            } else {
                alert('Error: ' + (data.error || 'Error desconocido'));
            }
        });
    }
    
    if (serverId) {
        loadWhitelist();
    }
</script>
{% endblock %}
