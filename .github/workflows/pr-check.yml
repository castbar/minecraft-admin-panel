name: PR Checks

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para escanear todo el historial
      
      - name: Check for secrets
        run: |
          # Verificar que no hay .env en el repo
          if [ -f .env ]; then
            echo "❌ ERROR: Archivo .env encontrado en el repositorio"
            exit 1
          fi
          
          # Verificar que no hay db.sqlite3
          if [ -f panel/db.sqlite3 ]; then
            echo "❌ ERROR: Archivo db.sqlite3 encontrado en el repositorio"
            exit 1
          fi
          
          echo "✅ No se encontraron archivos sensibles"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd panel
          pip install -r requirements.txt
      
      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci-only' }}
          DEBUG: 'False'
        run: |
          cd panel
          python manage.py check
          python manage.py check --deploy || true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build
        run: |
          cd frontend
          npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "frontend/www" ] || [ ! -f "frontend/www/index.html" ]; then
            echo "❌ ERROR: Build no generó los archivos esperados"
            exit 1
          fi
          echo "✅ Build exitoso"

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run linter
        run: |
          cd frontend
          npm run lint || echo "⚠️ Linter encontró problemas (no bloqueante)"







