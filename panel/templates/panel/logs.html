{% extends 'panel/base.html' %}

{% block title %}Logs - Minecraft Server Manager{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4"><i class="bi bi-file-text"></i> Logs del Servidor</h2>
    
    <div class="card">
        <div class="card-header">
            <h5>Últimas Líneas del Log</h5>
        </div>
        <div class="card-body">
            <div id="logs-content" style="background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; font-family: monospace; max-height: 600px; overflow-y: auto;">
                Cargando logs...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function loadLogs() {
        if (!serverId) return;
        
        fetch(`/api/logs/?server_id=${serverId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const logsEl = document.getElementById('logs-content');
                    if (data.data && Array.isArray(data.data)) {
                        // Si es un array de líneas, unirlas
                        logsEl.textContent = data.data.join('');
                    } else if (data.logs) {
                        logsEl.textContent = data.logs;
                    } else {
                        logsEl.textContent = 'No hay logs disponibles';
                    }
                    logsEl.scrollTop = logsEl.scrollHeight;
                } else {
                    document.getElementById('logs-content').textContent = 'Error: ' + (data.error || 'Error desconocido');
                }
            })
            .catch(error => {
                document.getElementById('logs-content').textContent = 'Error al cargar logs: ' + error;
            });
    }
    
    if (serverId) {
        loadLogs();
        setInterval(loadLogs, 10000);
    }
</script>
{% endblock %}
