{% extends 'panel/base.html' %}

{% block title %}Configuración - {{ block.super }}{% endblock %}

{% block content %}
<div class="card">
    <h2>Configuración del Servidor: {{ server.name }}</h2>
</div>

<div class="card">
    <h2>Configuración General</h2>
    <div id="settingsForm">
        <p>Cargando configuración...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loadSettings() {
    fetch(`/api/servers/{{ server.id }}/settings/`)
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const settings = data.data;
            document.getElementById('settingsForm').innerHTML = `
                <form onsubmit="saveSettings(event)">
                    <div style="margin-bottom: 1rem;">
                        <label>Nombre del Servidor:</label>
                        <input type="text" name="name" value="${settings.name || ''}" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label>Modo de Autenticación:</label>
                        <select name="auth_mode" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;">
                            <option value="whitelist" ${settings.auth_mode === 'whitelist' ? 'selected' : ''}>Solo Whitelist</option>
                            <option value="database" ${settings.auth_mode === 'database' ? 'selected' : ''}>Base de Datos</option>
                            <option value="both" ${settings.auth_mode === 'both' ? 'selected' : ''}>Whitelist + Base de Datos</option>
                            <option value="public" ${settings.auth_mode === 'public' ? 'selected' : ''}>Público</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Guardar Configuración</button>
                </form>
            `;
        }
    });
}

function saveSettings(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    
    fetch(`/api/servers/{{ server.id }}/settings/update/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data),
        credentials: 'same-origin'
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message || data.error || 'Configuración guardada');
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

loadSettings();
</script>
{% endblock %}
