<div class="layout-container" [class.sidebar-collapsed]="sidebarCollapsed$ | async">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed$ | async">
    <div class="sidebar-header">
      <h2 *ngIf="!(sidebarCollapsed$ | async)">Minecraft Admin</h2>
      <ion-button 
        fill="clear" 
        size="small" 
        (click)="toggleSidebar()"
        class="toggle-btn">
        <ion-icon 
          [name]="(sidebarCollapsed$ | async) ? 'chevron-forward-outline' : 'chevron-back-outline'"
          slot="icon-only">
        </ion-icon>
      </ion-button>
    </div>
    
    <nav class="sidebar-nav">
      <ion-list lines="none">
        <ion-item 
          button 
          routerLink="/dashboard" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Dashboard</ion-label>
        </ion-item>
        
        <ion-item 
          button 
          routerLink="/servers" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="server-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Servidores</ion-label>
        </ion-item>
        
        <ion-item 
          button 
          routerLink="/players" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Jugadores</ion-label>
        </ion-item>
        
        <ion-item 
          button 
          routerLink="/mods" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="cube-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Mods</ion-label>
        </ion-item>
        
        <ion-item 
          button 
          routerLink="/backups" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="folder-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Backups</ion-label>
        </ion-item>
        
        <ion-item 
          button 
          routerLink="/settings" 
          routerDirection="root"
          class="nav-item">
          <ion-icon name="settings-outline" slot="start"></ion-icon>
          <ion-label *ngIf="!(sidebarCollapsed$ | async)">Configuración</ion-label>
        </ion-item>
      </ion-list>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Minecraft Admin Panel</ion-title>
        
        <div class="header-actions" slot="end">
          <div class="server-selector">
            <ion-select 
              *ngIf="(servers$ | async) as servers"
              [value]="currentServerId$ | async"
              (ionChange)="onServerChange($event)"
              placeholder="Seleccionar servidor"
              interface="popover"
              class="server-select">
              <ion-select-option 
                *ngFor="let server of servers" 
                [value]="server.id">
                {{ server.name }}
              </ion-select-option>
            </ion-select>
          </div>
          
          <ion-button (click)="logout()" fill="clear">
            <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <router-outlet></router-outlet>
    </ion-content>
  </div>
</div>
