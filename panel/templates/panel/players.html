{% extends 'panel/base.html' %}

{% block title %}Jugadores - {{ block.super }}{% endblock %}

{% block content %}
<div class="card">
    <h2>Gestión de Jugadores: {{ server.name }}</h2>
</div>

<div class="card">
    <h2>Jugadores Online</h2>
    <div id="playersList">Cargando...</div>
</div>

<div class="card">
    <h2>Whitelist</h2>
    <div style="margin-bottom: 1rem;">
        <input type="text" id="playerName" placeholder="Nombre del jugador" style="width: 70%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;">
        <button class="btn" onclick="addToWhitelist()">Agregar a Whitelist</button>
    </div>
    <div id="whitelistList">Cargando...</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loadPlayers() {
    fetch(`/api/players/?server_id={{ server.id }}`)
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const players = data.data.players || [];
            document.getElementById('playersList').innerHTML = players.length > 0 
                ? '<ul>' + players.map(p => `<li>${p}</li>`).join('') + '</ul>'
                : '<p>No hay jugadores online</p>';
        }
    });
}

function loadWhitelist() {
    fetch(`/api/servers/{{ server.id }}/whitelist/`)
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const whitelist = data.data.whitelist || [];
            document.getElementById('whitelistList').innerHTML = whitelist.length > 0
                ? '<ul>' + whitelist.map(p => `<li>${p} <button class="btn btn-danger" onclick="removeFromWhitelist('${p}')">Eliminar</button></li>`).join('') + '</ul>'
                : '<p>La whitelist está vacía</p>';
        }
    });
}

function addToWhitelist() {
    const playerName = document.getElementById('playerName').value;
    if (!playerName) return;
    
    fetch(`/api/servers/{{ server.id }}/whitelist/add/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username: playerName }),
        credentials: 'same-origin'
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message || data.error || 'Jugador agregado');
        document.getElementById('playerName').value = '';
        loadWhitelist();
    });
}

function removeFromWhitelist(playerName) {
    if (!confirm('¿Eliminar ' + playerName + ' de la whitelist?')) return;
    
    fetch(`/api/servers/{{ server.id }}/whitelist/remove/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username: playerName }),
        credentials: 'same-origin'
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message || data.error || 'Jugador eliminado');
        loadWhitelist();
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

loadPlayers();
loadWhitelist();
setInterval(loadPlayers, 5000);
</script>
{% endblock %}
